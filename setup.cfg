[flake8]
max-line-length = 88
per-file-ignores = __init__.py:F401
ignore = E203, W503
ban-relative-imports = True
inline-quotes = "

[sqla_testing]
requirement_cls=databend_sqlalchemy.requirements:Requirements
profile_file = .profiles.txt

[db]
default=databend://databend:databend@localhost:8000/default?sslmode=disable
async=databend+async://databend:databend@localhost:8000/default?sslmode=disable
